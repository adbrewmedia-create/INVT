<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Invoice Tracker & Books</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar with section tabs; each section is a working sheet (tiles → controls → table); invoice detail slides in as a side panel. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --sunk:#E9EFED; --ink:#14201C; --muted:#5A6964; --line:#D6DFDB;
  --accent:#0D6A56; --accent-ink:#FFFFFF; --accent-soft:#DCEFE9;
  --ok:#23774A; --ok-soft:#DDF1E5; --warn:#9A5B00; --warn-soft:#FBEBD2; --bad:#B0281F; --bad-soft:#F9DEDB; --info:#2952A3; --info-soft:#DFE7F7; --draft:#6B6F7A; --draft-soft:#E8E9EC;
  --shadow:0 10px 40px rgba(14,40,32,.18);
  --f-display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --sunk:#1B2522; --ink:#E3ECE8; --muted:#93A39D; --line:#27342F;
  --accent:#4CC3A0; --accent-ink:#05231B; --accent-soft:#163A30;
  --ok:#62C88F; --ok-soft:#173226; --warn:#E5A84E; --warn-soft:#3A2A12; --bad:#F2776C; --bad-soft:#3D1A17; --info:#86AAF0; --info-soft:#1B2840; --draft:#A3A8B3; --draft-soft:#262A31;
  --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --sunk:#1B2522; --ink:#E3ECE8; --muted:#93A39D; --line:#27342F;
  --accent:#4CC3A0; --accent-ink:#05231B; --accent-soft:#163A30;
  --ok:#62C88F; --ok-soft:#173226; --warn:#E5A84E; --warn-soft:#3A2A12; --bad:#F2776C; --bad-soft:#3D1A17; --info:#86AAF0; --info-soft:#1B2840; --draft:#A3A8B3; --draft-soft:#262A31;
  --shadow:0 10px 40px rgba(0,0,0,.5); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font:700 17px/1.2 var(--f-display);letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.tabs button:hover{color:var(--ink)}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.test{background:var(--warn-soft);color:var(--warn)}
.chip.live{background:var(--ok-soft);color:var(--ok)}
main{padding-block:22px 80px}
h1{font:700 26px/1.2 var(--f-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font:700 17px/1.3 var(--f-display);margin:0 0 10px;text-wrap:balance}
h3{font:600 13px/1.3 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,nav.tabs button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tile .v{font:500 22px/1.25 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile.bad .v{color:var(--bad)} .tile.ok .v{color:var(--ok)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .c{font-family:var(--f-mono);font-size:11.5px;opacity:.75;margin-left:3px}
select,input[type=text],input[type=search],input[type=date],input[type=number],input[type=email],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
input[type=search]{min-width:200px}
textarea{width:100%;min-height:90px;resize:vertical}
.sumline{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;padding:10px 14px;background:var(--sunk);border-radius:9px;margin-bottom:10px;font-size:13px}
.sumline b{font-weight:600}
.sumline .num{text-align:left}
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
tfoot td{font-weight:600;background:var(--sunk);border-top:1px solid var(--line);border-bottom:0}
td:first-child{white-space:nowrap}
td.desc{min-width:200px}
td.note{color:var(--muted);font-size:12.5px;max-width:240px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-Draft{background:var(--draft-soft);color:var(--draft)}
.p-Outstanding{background:var(--info-soft);color:var(--info)}
.p-Overdue{background:var(--bad-soft);color:var(--bad)}
.p-Partially{background:var(--warn-soft);color:var(--warn)}
.p-Paid{background:var(--ok-soft);color:var(--ok)}
.p-Void{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--sunk);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 16px var(--f-display);margin-bottom:6px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:9px;margin-bottom:16px;font-size:13.5px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner .btn{margin-left:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checklist li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.checklist li:last-child{border-bottom:0}
.mark{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.mark.ok{background:var(--ok-soft);color:var(--ok)} .mark.warn{background:var(--warn-soft);color:var(--warn)} .mark.bad{background:var(--bad-soft);color:var(--bad)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:13.5px}
.kv .tot{font-weight:600;border-top:1px solid var(--line);padding-top:6px}
.drawer-back{position:fixed;inset:0;background:rgba(10,20,17,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);z-index:41;box-shadow:var(--shadow);overflow-y:auto;padding:max(18px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(40px,env(safe-area-inset-bottom,0px)) 20px}
.drawer .dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.drawer section{margin-bottom:16px}
.modal-back{position:fixed;inset:0;background:rgba(10,20,17,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100% - 32px);overflow-y:auto;padding:20px}
.modal.wide{width:min(980px,100%)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form label.row{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500}
.form input,.form select,.form textarea{font-weight:400;color:var(--ink)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 12px 12px;font-size:13.5px}
.timeline li::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.timeline li.done::before{background:var(--accent);border-color:var(--accent)}
.timeline li.next::before{border-color:var(--accent);border-style:dashed}
.timeline .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:block}
.sched{width:100%}
.sched td{padding:6px 8px}
.emailprev{background:var(--sunk);border-radius:9px;padding:12px 14px;font-size:13.5px;white-space:pre-wrap}
.emailprev .h{font-size:12.5px;color:var(--muted);margin-bottom:8px;white-space:normal}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;z-index:60;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.errs{color:var(--bad);font-size:12.5px} .warns{color:var(--warn);font-size:12.5px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.cmt{width:100%;min-height:32px;font-size:12.5px;padding:4px 8px}
@media (max-width:640px){ h1{font-size:22px} .tile .v{font-size:19px} input[type=search]{min-width:0;flex:1} }
@media (prefers-reduced-motion:no-preference){ .drawer{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}} }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body><div id="shell"></div><div id="modal-root"></div>
<script src="js/logic.js"></script><script src="js/store-local.js"></script><script src="js/app.js"></script>
</body></html>
